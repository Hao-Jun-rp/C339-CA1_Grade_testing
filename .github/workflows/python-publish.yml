name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**.py'
      - 'test/**.py'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**.py'
      - 'test/**.py'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: python -m pytest -v
